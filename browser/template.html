<meta charset="utf-8">
<title>Chessbot Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Symbols+2&display=swap">
<style>
/* Layout: board as the hero on the left, a scoresheet-style control column on the right; stacks on phones. */
:root {
  --bg: #eef1f2;
  --panel: #ffffff;
  --ink: #1d2a30;
  --muted: #5d6d74;
  --line: #d3dade;
  --accent: #2f6f8f;
  --accent-ink: #ffffff;
  --sq-light: #dfe5e8;
  --sq-dark: #8aa2ae;
  --hl-move: rgba(214, 178, 62, .55);
  --hl-sel: rgba(47, 111, 143, .55);
  --hl-check: rgba(196, 64, 52, .75);
  --dot: rgba(29, 42, 48, .28);
  --good: #2e7d4f;
  --warn: #a8641a;
  --piece-w: #ffffff;
  --piece-b: #1a2226;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-pieces: "Noto Sans Symbols 2", "Segoe UI Symbol", "Apple Symbols", "DejaVu Sans", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12191c; --panel: #1a2428; --ink: #e3eaed; --muted: #93a4ab; --line: #2c3a40;
    --accent: #6fb3d2; --accent-ink: #0d1518; --sq-light: #9fb3bd; --sq-dark: #56707c;
    --dot: rgba(10, 18, 22, .38); --good: #6cc592; --warn: #e0a35a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12191c; --panel: #1a2428; --ink: #e3eaed; --muted: #93a4ab; --line: #2c3a40;
  --accent: #6fb3d2; --accent-ink: #0d1518; --sq-light: #9fb3bd; --sq-dark: #56707c;
  --dot: rgba(10, 18, 22, .38); --good: #6cc592; --warn: #e0a35a; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 4vw, 2.2rem); letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.tag { font-family: var(--font-mono); font-size: .78rem; color: var(--muted); }
.main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 340px); gap: 22px; align-items: start; }
@media (max-width: 820px) { .main { grid-template-columns: minmax(0, 1fr); } }

.board-col { display: grid; gap: 10px; min-width: 0; }
.board { width: min(100%, 600px); aspect-ratio: 1; max-width: 100%; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); grid-template-rows: repeat(8, minmax(0, 1fr));
  border-radius: 6px; overflow: hidden; box-shadow: 0 1px 0 var(--line), 0 10px 30px rgba(20, 40, 50, .18); user-select: none; touch-action: manipulation; }
.sq { position: relative; min-width: 0; min-height: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 0; padding: 0; margin: 0; cursor: pointer; font: inherit; }
.sq.l { background: var(--sq-light); } .sq.d { background: var(--sq-dark); }
.sq:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; z-index: 1; }
.sq.last::before, .sq.sel::before, .sq.check::before { content: ""; position: absolute; inset: 0; }
.sq.last::before { background: var(--hl-move); } .sq.sel::before { background: var(--hl-sel); }
.sq.check::before { background: radial-gradient(circle, var(--hl-check) 0 45%, transparent 72%); }
.sq.target::after { content: ""; position: absolute; width: 30%; height: 30%; border-radius: 50%; background: var(--dot); }
.sq.target.cap::after { width: 86%; height: 86%; background: transparent; border: 5px solid var(--dot); }
.pc { position: relative; z-index: 1; font-family: var(--font-pieces); font-size: min(9.4vw, 58px); line-height: 1; pointer-events: none; }
.pc.w { color: var(--piece-w); -webkit-text-stroke: 1.4px #1a2226; text-shadow: 0 2px 2px rgba(0, 0, 0, .25); }
.pc.b { color: var(--piece-b); -webkit-text-stroke: .6px #1a2226; text-shadow: 0 1px 1px rgba(255, 255, 255, .15); }
.coord { position: absolute; font-family: var(--font-mono); font-size: .62rem; opacity: .75; pointer-events: none; z-index: 1; }
.coord.f { right: 3px; bottom: 1px; } .coord.r { left: 3px; top: 1px; }
.sq.l .coord { color: var(--sq-dark); } .sq.d .coord { color: var(--sq-light); }

.status { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 2.2em; }
.pill { font-family: var(--font-mono); font-size: .74rem; letter-spacing: .04em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); }
.pill.think { border-color: var(--accent); color: var(--accent); }
.pill.over { border-color: var(--warn); color: var(--warn); }
.meter { flex: 1 1 120px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.meter > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s linear; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 16px; min-width: 0; }
.panel h2 { font-family: var(--font-display); font-weight: 600; font-size: 1rem; margin: 0; letter-spacing: -.01em; }
.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.field { display: grid; gap: 6px; }
.seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--ink); font: 500 .85rem var(--font-body); padding: 8px 6px; cursor: pointer; border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button:focus-visible, .btn:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { flex: 1 1 auto; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: 500 .85rem var(--font-body); padding: 8px 12px; border-radius: 8px; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .5; cursor: default; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.hint { font-size: .8rem; color: var(--muted); margin: 0; }

.moves { font-family: var(--font-mono); font-size: .85rem; max-height: 180px; overflow-y: auto; display: grid; grid-template-columns: 2.6em 1fr 1fr; gap: 2px 8px; font-variant-numeric: tabular-nums; }
.moves .n { color: var(--muted); }
.moves .cur { background: var(--hl-move); border-radius: 3px; padding-inline: 2px; }
.empty { color: var(--muted); font-size: .85rem; }
table.think { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: .8rem; font-variant-numeric: tabular-nums; }
table.think th { text-align: left; font-weight: 500; color: var(--muted); border-bottom: 1px solid var(--line); padding: 3px 4px; }
table.think td { padding: 3px 4px; border-bottom: 1px dashed var(--line); }
table.think td.num, table.think th.num { text-align: right; }
.bar { display: inline-block; height: 6px; background: var(--accent); border-radius: 2px; vertical-align: middle; }

.card { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 8px; }
.card dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; font-size: .83rem; }
.card dt { color: var(--muted); } .card dd { margin: 0; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.note { font-size: .82rem; border-left: 3px solid var(--warn); padding: 6px 10px; background: var(--bg); border-radius: 0 6px 6px 0; margin: 0; }

.promo { position: fixed; inset: 0; background: rgba(10, 20, 25, .45); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
.promo-box { background: var(--panel); border-radius: 12px; padding: 16px; display: grid; gap: 10px; text-align: center; }
.promo-box .row button { font-family: var(--font-pieces); color: var(--piece-b); font-size: 44px; width: 64px; height: 64px; border-radius: 8px; border: 1px solid var(--line); background: var(--sq-light); cursor: pointer; }
@media (prefers-reduced-motion: reduce) { .meter > i { transition: none; } }
</style>

<div class="wrap">
  <header>
    <h1>Chessbot Board</h1>
    <span class="tag" id="tagline">self-play network · running in your browser</span>
  </header>

  <div class="main">
    <section class="board-col" aria-label="Chess board">
      <div class="board" id="board" role="grid"></div>
      <div class="status">
        <span class="pill" id="status">White to move</span>
        <div class="meter" id="meter" hidden><i id="meterFill"></i></div>
      </div>
    </section>

    <aside class="panel">
      <div class="field">
        <span class="label" id="lblBot">Opponent</span>
        <div class="seg" role="group" aria-labelledby="lblBot" id="botSeg">
          <button type="button" data-bot="mcts" id="bot-mcts">Network</button>
          <button type="button" data-bot="alphabeta" id="bot-ab">Alpha-beta</button>
          <button type="button" data-bot="random" id="bot-random">Random</button>
        </div>
        <p class="hint" id="botHint"></p>
      </div>

      <div class="field" id="strengthField">
        <label class="label" for="strength" id="strengthLabel">Simulations per move</label>
        <input type="range" id="strength" min="0" max="4" step="1" value="2">
        <p class="hint" id="strengthHint"></p>
      </div>

      <div class="field">
        <span class="label" id="lblSide">You play</span>
        <div class="seg" role="group" aria-labelledby="lblSide" id="sideSeg">
          <button type="button" data-side="w" id="side-w">White</button>
          <button type="button" data-side="b" id="side-b">Black</button>
        </div>
      </div>

      <div class="row">
        <button type="button" class="btn primary" id="newGame">New game</button>
        <button type="button" class="btn" id="undo">Take back</button>
        <button type="button" class="btn" id="flip">Flip</button>
      </div>

      <div class="field">
        <h2>Scoresheet</h2>
        <div class="moves" id="moves"></div>
      </div>

      <div class="field">
        <h2>What the bot saw</h2>
        <div id="thinking"><p class="empty">The bot's search summary appears here after its move.</p></div>
      </div>

      <div class="card" id="modelCard"></div>
    </aside>
  </div>
</div>

<div class="promo" id="promo" hidden>
  <div class="promo-box" role="dialog" aria-label="Choose promotion piece">
    <strong>Promote to</strong>
    <div class="row" id="promoRow"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
/*__BOT_JS__*/
</script>
<script id="model-data" type="application/json">/*__MODEL_JSON__*/</script>
<script>
(function () {
  "use strict";
  const { Game, Net, MCTS, AlphaBeta, sqName } = window.ChessBot;
  const spec = JSON.parse(document.getElementById("model-data").textContent);
  const net = new Net(spec.net);
  const GLYPH = { k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟" };
  const SIMS = [16, 32, 64, 128, 256];
  const DEPTHS = [1, 2, 3, 4, 5];

  const S = { game: new Game(), human: "w", bot: "alphabeta", level: 2, flipped: false,
              sel: null, busy: false, token: 0, last: null, sans: [] };

  const $ = (id) => document.getElementById(id);
  const boardEl = $("board");

  /* ------------------------------------------------------------ rendering */
  function orientationBlack() { return (S.human === "b") !== S.flipped; }

  function render() {
    const c = S.game.chess, board = c.board(), legal = S.game.legal();
    const targets = S.sel ? legal.filter((m) => m.from === S.sel) : [];
    const inCheck = c.in_check();
    boardEl.textContent = "";
    const black = orientationBlack();
    for (let r = 0; r < 8; r++) {
      for (let f = 0; f < 8; f++) {
        const rank = black ? r : 7 - r, file = black ? 7 - f : f;
        const name = sqName(rank * 8 + file);
        const p = board[7 - rank][file];
        const b = document.createElement("button");
        b.type = "button";
        b.className = "sq " + ((rank + file) % 2 ? "l" : "d");
        b.dataset.sq = name;
        b.setAttribute("aria-label", name + (p ? " " + (p.color === "w" ? "white " : "black ") + p.type : ""));
        if (S.last && (S.last.from === name || S.last.to === name)) b.classList.add("last");
        if (S.sel === name) b.classList.add("sel");
        const t = targets.find((m) => m.to === name);
        if (t) { b.classList.add("target"); if (t.captured) b.classList.add("cap"); }
        if (inCheck && p && p.type === "k" && p.color === c.turn()) b.classList.add("check");
        if (p) {
          const s = document.createElement("span");
          s.className = "pc " + p.color;
          s.textContent = GLYPH[p.type] + "︎";
          b.appendChild(s);
        }
        if (r === 7) { const k = document.createElement("span"); k.className = "coord f"; k.textContent = name[0]; b.appendChild(k); }
        if (f === 0) { const k = document.createElement("span"); k.className = "coord r"; k.textContent = name[1]; b.appendChild(k); }
        boardEl.appendChild(b);
      }
    }
    renderMoves();
    renderStatus();
  }

  function renderMoves() {
    const el = $("moves");
    el.textContent = "";
    if (!S.sans.length) { el.innerHTML = '<span class="empty" style="grid-column:1/-1">No moves yet.</span>'; return; }
    for (let i = 0; i < S.sans.length; i += 2) {
      const n = document.createElement("span"); n.className = "n"; n.textContent = i / 2 + 1 + ".";
      el.appendChild(n);
      for (const j of [i, i + 1]) {
        const m = document.createElement("span");
        m.textContent = S.sans[j] || "";
        if (j === S.sans.length - 1) m.className = "cur";
        el.appendChild(m);
      }
    }
    el.scrollTop = el.scrollHeight;
  }

  function gameOverText() {
    const c = S.game.chess, t = S.game.terminal();
    if (t === null) return null;
    if (t < 0) return (c.turn() === "w" ? "Black" : "White") + " wins by checkmate";
    if (c.in_stalemate()) return "Draw by stalemate";
    if (c.insufficient_material()) return "Draw by insufficient material";
    if (S.game.repetitions() >= 3) return "Draw by threefold repetition";
    return "Draw by the fifty-move rule";
  }

  function renderStatus(text, cls) {
    const st = $("status");
    const over = gameOverText();
    st.className = "pill" + (cls ? " " + cls : over ? " over" : "");
    st.textContent = text || over || (S.game.turn() === "w" ? "White" : "Black") + " to move" +
      (S.game.turn() === S.human ? " · your turn" : "");
    $("undo").disabled = S.busy || S.sans.length === 0;
  }

  function renderControls() {
    for (const b of $("botSeg").children) b.setAttribute("aria-pressed", String(b.dataset.bot === S.bot));
    for (const b of $("sideSeg").children) b.setAttribute("aria-pressed", String(b.dataset.side === S.human));
    const hints = {
      mcts: `Monte-Carlo tree search guided by the policy/value network trained by self-play (iteration ${spec.source.iteration}).`,
      alphabeta: "Classical engine: alpha-beta search with quiescence, material and piece-square tables.",
      random: "Picks a uniformly random legal move. The weakest baseline.",
    };
    $("botHint").textContent = hints[S.bot];
    $("strengthField").hidden = S.bot === "random";
    if (S.bot === "mcts") {
      $("strengthLabel").textContent = "Simulations per move";
      $("strengthHint").textContent = `${SIMS[S.level]} network evaluations per move. More is stronger and slower.`;
    } else {
      $("strengthLabel").textContent = "Search depth";
      $("strengthHint").textContent = `Up to ${DEPTHS[S.level]} plies plus captures, capped at 4 s per move.`;
    }
    $("strength").value = S.level;
  }

  function renderModelCard() {
    const src = spec.source, ev = spec.evaluation || [];
    const rows = ev.map((e) => `<dt>vs ${e.opponent}</dt><dd>+${e.wins} =${e.draws} −${e.losses} · Elo ${e.elo >= 0 ? "+" : ""}${Math.round(e.elo)} [${Math.round(e.elo_low)}, ${Math.round(e.elo_high)}]</dd>`).join("");
    $("modelCard").innerHTML = `
      <h2>About the network</h2>
      <dl>
        <dt>Checkpoint</dt><dd>${src.checkpoint} (iteration ${src.iteration})</dd>
        <dt>Gradient steps</dt><dd>${src.global_step.toLocaleString()}</dd>
        <dt>Parameters</dt><dd>${src.parameters.toLocaleString()}</dd>
        <dt>Architecture</dt><dd>${spec.net.channels} ch × ${spec.net.res_blocks} res blocks</dd>
        ${rows}
      </dl>
      ${spec.note ? `<p class="note">${spec.note}</p>` : ""}`;
  }

  function renderThinking(info) {
    const el = $("thinking");
    if (!info) { el.innerHTML = '<p class="empty">The bot\'s search summary appears here after its move.</p>'; return; }
    if (info.kind === "random") { el.innerHTML = `<p class="hint">Random move: ${info.san}.</p>`; return; }
    if (info.kind === "alphabeta") {
      const sc = Math.abs(info.score) > 99000 ? (info.score > 0 ? "mate ahead" : "getting mated")
        : (info.score >= 0 ? "+" : "") + (info.score / 100).toFixed(2) + " pawns";
      el.innerHTML = `<table class="think"><tr><th>Move</th><th class="num">Depth</th><th class="num">Score</th><th class="num">Nodes</th></tr>
        <tr><td>${info.san}</td><td class="num">${info.depth}</td><td class="num">${sc}</td><td class="num">${info.nodes.toLocaleString()}</td></tr></table>
        <p class="hint">Score is from the bot's side. Searched in ${info.seconds.toFixed(2)} s.</p>`;
      return;
    }
    const max = Math.max(...info.top.map((t) => t.visits), 1);
    el.innerHTML = `<table class="think"><tr><th>Move</th><th>Visits</th><th class="num">Prior</th><th class="num">Q</th></tr>
      ${info.top.map((t) => `<tr><td>${t.san}</td><td><span class="bar" style="width:${Math.round(60 * t.visits / max)}px"></span> ${t.visits}</td>
        <td class="num">${(100 * t.prior).toFixed(1)}%</td><td class="num">${t.q === null ? "–" : t.q.toFixed(2)}</td></tr>`).join("")}</table>
      <p class="hint">Network value of the position: ${info.value >= 0 ? "+" : ""}${info.value.toFixed(3)} (−1 lost … +1 won, bot's side). ${info.seconds.toFixed(2)} s.</p>`;
  }

  /* ------------------------------------------------------------ game flow */
  function play(move) {
    const r = S.game.push(move);
    S.sans.push(r.san);
    S.last = { from: r.from, to: r.to };
    S.sel = null;
    snapshot();
  }

  async function botMove() {
    if (S.game.terminal() !== null || S.game.turn() === S.human) return;
    const token = ++S.token;
    S.busy = true;
    renderStatus("Thinking…", "think");
    const meter = $("meter"), fill = $("meterFill");
    await new Promise((r) => setTimeout(r, 30));
    const t0 = performance.now();
    let move, info;
    if (S.bot === "random") {
      const legal = S.game.legal();
      move = legal[Math.floor(Math.random() * legal.length)];
      info = { kind: "random", san: move.san };
    } else if (S.bot === "alphabeta") {
      const r = await new AlphaBeta(spec.eval, { depth: DEPTHS[S.level], timeLimit: 4 }).search(S.game);
      move = r.move;
      info = { kind: "alphabeta", san: move.san, depth: r.depth, score: r.score, nodes: r.nodes, seconds: r.seconds };
    } else {
      meter.hidden = false; fill.style.width = "0";
      const r = await new MCTS(net, { simulations: SIMS[S.level], cPuct: spec.c_puct || 1.5 })
        .search(S.game, (d, n) => { fill.style.width = (100 * d / n) + "%"; });
      meter.hidden = true;
      move = r.move;
      info = { kind: "mcts", top: r.top, value: r.value, seconds: (performance.now() - t0) / 1000 };
    }
    if (token !== S.token) return;   // game was reset while thinking
    S.busy = false;
    play(move);
    renderThinking(info);
    render();
  }

  function onSquare(name) {
    if (S.busy || S.game.terminal() !== null || S.game.turn() !== S.human) return;
    const legal = S.game.legal();
    if (S.sel) {
      const cands = legal.filter((m) => m.from === S.sel && m.to === name);
      if (cands.length) {
        if (cands.length > 1) { askPromotion(cands); return; }
        play(cands[0]); render(); botMove(); return;
      }
    }
    const p = S.game.chess.get(name);
    S.sel = p && p.color === S.human && legal.some((m) => m.from === name) && S.sel !== name ? name : null;
    render();
  }

  function askPromotion(cands) {
    const row = $("promoRow");
    row.textContent = "";
    for (const piece of ["q", "r", "b", "n"]) {
      const m = cands.find((c) => c.promotion === piece);
      if (!m) continue;
      const b = document.createElement("button");
      b.type = "button"; b.id = "promo-" + piece;
      b.textContent = GLYPH[piece] + "︎";
      b.setAttribute("aria-label", { q: "queen", r: "rook", b: "bishop", n: "knight" }[piece]);
      b.onclick = () => { $("promo").hidden = true; play(m); render(); botMove(); };
      row.appendChild(b);
    }
    $("promo").hidden = false;
    row.firstChild.focus();
  }

  function newGame() {
    S.token++; S.busy = false; $("meter").hidden = true;
    S.game = new Game(); S.sans = []; S.last = null; S.sel = null;
    renderThinking(null); render(); snapshot(); botMove();
  }

  function replay(sans) {
    S.game = new Game(); S.sans = []; S.last = null;
    for (const san of sans) {
      const m = S.game.legal().find((x) => x.san === san);
      if (!m) break;
      play(m);
    }
  }

  function undo() {
    if (S.busy || !S.sans.length) return;
    let sans = S.sans.slice(0, -1);
    if (sans.length % 2 !== (S.human === "w" ? 0 : 1)) sans = sans.slice(0, -1);
    replay(sans); renderThinking(null); render();
  }

  /* ------------------------------------------------------------ wiring */
  boardEl.addEventListener("click", (e) => { const sq = e.target.closest(".sq"); if (sq) onSquare(sq.dataset.sq); });
  $("botSeg").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    S.bot = b.dataset.bot; renderControls(); snapshot();
  });
  $("sideSeg").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b || b.dataset.side === S.human) return;
    S.human = b.dataset.side; renderControls(); newGame();
  });
  $("strength").addEventListener("input", (e) => { S.level = +e.target.value; renderControls(); snapshot(); });
  $("newGame").onclick = newGame;
  $("undo").onclick = undo;
  $("flip").onclick = () => { S.flipped = !S.flipped; render(); };
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("promo").hidden = true; });

  function snapshot() {
    try { window.claude?.hot?.snapshot?.(() => ({ sans: S.sans, human: S.human, bot: S.bot, level: S.level })); } catch (_) {}
  }

  function start(data) {
    data = data || {};
    if (data.human) S.human = data.human;
    if (data.bot) S.bot = data.bot;
    if (Number.isInteger(data.level)) S.level = data.level;
    replay(Array.isArray(data.sans) ? data.sans : []);
    renderControls(); renderModelCard(); render(); snapshot(); botMove();
  }
  if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
})();
</script>
