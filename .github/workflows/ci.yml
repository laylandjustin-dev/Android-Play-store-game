name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The simulation is pure Kotlin and needs no Android SDK, so it runs first and fast.
  # A failure here is a failure of the game itself, not of its packaging.
  sim:
    name: Simulation (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test the simulation
        run: ./gradlew -Ppixeltown.simOnly=true :sim:build --stacktrace

      # Catches typos in app/ and drift against the simulation's API without needing the SDK,
      # so a broken app source fails here in seconds rather than in the slower Android job.
      - name: Check app sources against the simulation API
        run: ./scripts/check-app-sources.sh

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-test-report
          path: sim/build/reports/tests/test
          if-no-files-found: ignore

      # The renderer writes PNGs of generated maps on every test run. Publishing them means a
      # change to world generation is visible in the build, not just in the numbers.
      - name: Upload map previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-previews
          path: sim/build/preview/*.png
          if-no-files-found: ignore

  # The Android build. This is the only place :app is compiled — see the environment note in
  # CLAUDE.md — so treat a failure here as new information, not as flakiness.
  app:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble the debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # R8 has a habit of breaking reflection-based serialization, and the save format is
      # kotlinx.serialization — so the minified build is checked on every push, not at release.
      - name: Assemble the release APK (R8 + resource shrinking)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload the debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-town-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
